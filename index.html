<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrega Industrial — Iniciar sesión</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-mark">AI</div>
      <h1>Arrega Industrial</h1>
      <span>Ingresa a tu panel de control</span>
    </div>

    <div class="login-error" id="loginError">Usuario o contraseña incorrectos.</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="jhonatan.victorio" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="******" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <div class="login-footer">MVP — Arrega Industrial &copy; 2026</div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
